name: Flight Price Monitor

on:
  schedule:
    # Runs at 00:00, 06:00, and 12:00 UTC every day
    - cron: '0 0,6,12 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: CascadeProjects/skyscanner-monitor/requirements.txt

    - name: Install dependencies
      working-directory: CascadeProjects/skyscanner-monitor
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps

    - name: Run monitor script
      working-directory: CascadeProjects/skyscanner-monitor
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python monitor.py

    - name: Upload screenshots on failure or for debugging
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-screenshots
        path: |
          CascadeProjects/skyscanner-monitor/*.png
        if-no-files-found: ignore
        retention-days: 5
